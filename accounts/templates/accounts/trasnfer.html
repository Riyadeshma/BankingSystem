{% extends 'accounts/base.html' %}
{% block title %}Transfer{% endblock %}
{% block content %}
    <h1 class="mb-4">Transfer Money</h1>
    {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
    <form method="POST" class="w-50">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">From Account</label>
            <select name="from_account" class="form-select">
                {% for account in accounts %}
                    <option value="{{ account.id }}">{{ account.account_number }} (₹{{ account.balance }})</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">To Account Number</label>
            <input type="text" name="to_account_number" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Amount</label>
            <input type="number" name="amount" step="0.01" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary">Transfer</button>
        <a href="{% url 'dashboard' %}" class="btn btn-secondary">Cancel</a>
    </form>
{% endblock %}
